	<script src="./config/config.js"></script>
	<script>
		function loadRemoteData(src) {
			var scriptEl = document.createElement('script');
			scriptEl.src = src.replace(/.*\/(data|js)\//g, location.origin + '/$1/');
			document.head.appendChild(scriptEl);
		}
		Config.testclient = true;
		(function () {
			if (location.search !== '') {
				var m = /\?~~(([^:\/]*)(:[0-9]*)?)/.exec(location.search);
				if (m) {
					Config.server = {
						id: m[1],
						host: m[2],
						port: (m[3] && parseInt(m[3].substr(1))) || 8000
					};
				} else {
					alert('Unrecognised query string syntax: ' + location.search);
				}
			}
		})();

	</script>
	<!--[if lte IE 8]><script>
			Config.oldie = true;
		</script><![endif]-->

	<script>
		// Fuerza sprites/fx/audio a salir del mismo host donde sirves el cliente
		// (sin tocar Config.routes.client, que lo queremos en play.pokemonshowdown.com para el login HTTPS)
		Dex.resourcePrefix = location.origin + '/';

	</script>

	<script>
		// Arranca la app solo después de mergear el pokedex custom del servidor.
		// Si la API falla (servidor apagado, etc.) arranca igualmente sin custom.
		window.onload = () => {
			fetch('/api/pokedex')
				.then(r => r.ok ? r.json() : Promise.reject('HTTP ' + r.status))
				.then(serverDex => {
					const dex = window.BattlePokedex;
					if (!dex) return;
					let added = 0,
						updated = 0;
					for (const key of Object.keys(serverDex)) {
						if (!dex[key]) {
							dex[key] = serverDex[key];
							added++;
						} else {
							const c = dex[key],
								s = serverDex[key];
							let changed = false;
							for (const field of Object.keys(s)) {
								if (JSON.stringify(c[field]) !== JSON.stringify(s[field])) {
									c[field] = s[field];
									changed = true;
								}
							}
							if (changed) updated++;
						}
					}
					console.log('[CustomDex] Patch aplicado:', added, 'nuevos,', updated, 'actualizados.');

					// Añadir custom al BattleSearchIndex en orden alfabético (necesario para búsqueda binaria)
					const existingIds = new Set(Object.values(BattleSearchIndex).map(e => e[0]));
					for (const key of Object.keys(serverDex)) {
						if (existingIds.has(key)) continue;
						let lo = 0, hi = BattleSearchIndex.length;
						while (lo < hi) {
							const mid = (lo + hi) >> 1;
							if (BattleSearchIndex[mid][0] < key) lo = mid + 1;
							else hi = mid;
						}
						BattleSearchIndex.splice(lo, 0, [key, 'pokemon']);
					}

					// Parchear getBaseResults para incluir custom en el listado del teambuilder
					if (window.BattlePokemonSearch) {
						const _orig = BattlePokemonSearch.prototype.getBaseResults;
						BattlePokemonSearch.prototype.getBaseResults = function() {
							const results = _orig.call(this);
							const inResults = new Set(results.filter(e => e[0] === 'pokemon').map(e => e[1]));
							const customs = Object.keys(window.BattlePokedex).filter(id =>
								!inResults.has(id) && window.BattlePokedex[id]?.num >= 2000
							);
							if (customs.length) {
								results.push(['header', 'Custom']);
								for (const id of customs) results.push(['pokemon', id]);
							}
							return results;
						};
					}

					console.log('[CustomDex] Índice de búsqueda actualizado.');

					// Cargar movimientos custom del servidor
					return fetch('/api/moves');
				})
				.then(r => r ? (r.ok ? r.json() : Promise.reject('HTTP ' + r.status)) : null)
				.then(serverMoves => {
					if (!serverMoves) return;
					const moves = window.BattleMoves;
					if (!moves) return;
					let added = 0, updated = 0;
					for (const key of Object.keys(serverMoves)) {
						if (!moves[key]) {
							moves[key] = serverMoves[key];
							added++;
						} else {
							const c = moves[key], s = serverMoves[key];
							let changed = false;
							for (const field of Object.keys(s)) {
								if (JSON.stringify(c[field]) !== JSON.stringify(s[field])) {
									c[field] = s[field];
									changed = true;
								}
							}
							if (changed) updated++;
						}
					}
					console.log('[CustomMoves] Patch aplicado:', added, 'nuevos,', updated, 'actualizados.');
				})
				.catch(err => {
					console.warn('[CustomMoves] API no disponible:', err);
				})
				.finally(() => {
					window.app = new App();
				});
		};

	</script>
